apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-app-blue
  labels:
    app: messaging_app
    version: "1.0"
    deployment: blue
spec:
  replicas: 3
  selector:
    matchLabels:
      app: messaging_app
      version: "1.0"
  template:
    metadata:
      labels:
        app: messaging_app
        version: "1.0"
        deployment: blue
    spec:
      containers:
      - name: messaging_app
        image: awinimaxwell/django-app:v1.0
        ports:
        - containerPort: 8000
        env:
        - name: APP_VERSION
          value: "1.0-blue"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: django-secret
              key: database-url
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health/
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health/
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: django-app-blue-service
  labels:
    app: messaging_app
    deployment: blue
spec:
  selector:
    app: messaging_app
    deployment: blue
  ports:
  - port: 80
    targetPort: 8000
  type: ClusterIP