apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-app-blue
  labels:
    app: message_app
    version: "2.0"
    deployment: blue
  annotations:
    kubernetes.io/change-cause: "Update to version 2.0 with new features"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: messaging_app
      version: "2.0"
  template:
    metadata:
      labels:
        app: messaging_app
        version: "2.0"
        deployment: blue
    spec:
      containers:
      - name: messaging_app
        image: your-username/django-app:v2.0  # Updated to version 2.0
        ports:
        - containerPort: 8000
        env:
        - name: APP_VERSION
          value: "2.0-blue"
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: django-secret
              key: database-url
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health/
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health/
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 1
---
apiVersion: v1
kind: Service
metadata:
  name: django-app-blue-service
  labels:
    app: messaging_app
    deployment: blue
spec:
  selector:
    app: dmessaging_app
    deployment: blue
  ports:
  - port: 80
    targetPort: 8000
  type: ClusterIP