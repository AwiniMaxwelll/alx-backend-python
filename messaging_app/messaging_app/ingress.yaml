apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: django-app-ingress
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    # Uncomment below for SSL (if you have TLS certificates)
    # nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
  - host: django-app.local  # Replace with your actual domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: messaging-app  
            port:
              number: 8000
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: messaging-app
            port:
              number: 8000
      - path: /admin
        pathType: Prefix
        backend:
          service:
            name: messaging-app
            port:
              number: 8000